<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Pedidos</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="css/estilos.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="encabezado">
        <div class="encabezado__marca">
            <!-- Logo opcional: guarda tu archivo como img/logo.png. Si no existe, se muestra el icono. -->
            <img class="encabezado__logo" src="img/logo.png" alt="" onerror="this.remove()">
            <span class="material-symbols-outlined encabezado__icono" aria-hidden="true">restaurant</span>
            <h1 class="encabezado__titulo">Sistema de Pedidos</h1>
            <span id="etiqueta-simulador" class="etiqueta-simulador" hidden>MODO SIMULADOR</span>
        </div>
        <nav class="navegacion" aria-label="Secciones">
            <a class="pestana" href="#/ordenes" data-ruta="ordenes">
                <span class="material-symbols-outlined pestana__icono" aria-hidden="true">receipt_long</span>
                <span class="pestana__nombre">Órdenes</span>
                <span class="pestana__actor">Mesero</span>
            </a>
            <a class="pestana" href="#/cocina" data-ruta="cocina">
                <span class="material-symbols-outlined pestana__icono" aria-hidden="true">skillet</span>
                <span class="pestana__nombre">Cocina</span>
                <span class="pestana__actor">Cocinero</span>
            </a>
            <a class="pestana" href="#/caja" data-ruta="caja">
                <span class="material-symbols-outlined pestana__icono" aria-hidden="true">point_of_sale</span>
                <span class="pestana__nombre">Caja</span>
                <span class="pestana__actor">Cajero</span>
            </a>
            <a class="pestana" href="#/menu" data-ruta="menu">
                <span class="material-symbols-outlined pestana__icono" aria-hidden="true">menu_book</span>
                <span class="pestana__nombre">Menú</span>
                <span class="pestana__actor">Administrador</span>
            </a>
        </nav>
    </header>

    <!-- Portada: guarda tu foto como img/portada.jpg (ver img/LEEME.txt). Sin foto se ve un fondo liso. -->
    <div class="portada" aria-hidden="true"></div>

    <main id="contenido" class="contenido" tabindex="-1"></main>

    <div id="notificaciones" class="notificaciones" aria-live="polite"></div>
    <div id="modal-raiz"></div>
</body>
</html>
